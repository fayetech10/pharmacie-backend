server:
  # Render injecte la variable PORT ; on la respecte (fallback SERVER_PORT puis 8080 en local).
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  datasource:
    # En production (Render), renseigner SPRING_DATASOURCE_URL OU les variables DB_* injectées
    # depuis la base PostgreSQL gérée (voir render.yaml). Les défauts ci-dessous ne servent qu'au
    # développement local et ne contiennent aucun identifiant sensible.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pharmacie_csu}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
  jpa:
    hibernate:
      # Crée / met à jour automatiquement le schéma (tables + index) au démarrage.
      ddl-auto: ${JPA_DDL_AUTO:update}
    # Évite de garder la session ouverte pendant le rendu de la réponse (anti-pattern de perf).
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  application:
    name: pharmacie-csu

app:
  jwt:
    # OBLIGATOIRE : définir APP_JWT_SECRET (>= 32 caractères aléatoires).
    # Aucune valeur par défaut : le démarrage échoue volontairement si la variable
    # n'est pas fournie (voir JwtUtil), pour éviter tout secret prévisible.
    secret: ${APP_JWT_SECRET:OI90JICKOIJIRSJIJSIJCSIJCRSJVJIVRIJVJSRJRIVJISVIJ}
    expiration: ${APP_JWT_EXPIRATION:86400000}

cors:
  # Origines autorisées (séparées par des virgules). Surcharger via CORS_ALLOWED_ORIGINS en prod.
  # Les motifs wildcard sont acceptés (ex: https://*.vercel.app pour les previews Vercel).
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

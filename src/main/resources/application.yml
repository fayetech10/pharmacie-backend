server:
  # Render injecte la variable PORT ; on la respecte (fallback SERVER_PORT puis 8080 en local).
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  datasource:
    # Par défaut, on utilise la base H2 locale si aucune variable d'environnement (comme SPRING_DATASOURCE_URL en prod) n'est fournie.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./.h2data/pharmacie_csu;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      # Crée / met à jour automatiquement le schéma (tables + index) au démarrage.
      ddl-auto: ${JPA_DDL_AUTO:update}
    # Évite de garder la session ouverte pendant le rendu de la réponse (anti-pattern de perf).
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  h2:
    console:
      enabled: true
      path: /h2-console
  application:
    name: pharmacie-csu

app:
  jwt:
    # OBLIGATOIRE : définir APP_JWT_SECRET (>= 32 caractères aléatoires).
    # Aucune valeur par défaut : le démarrage échoue volontairement si la variable
    # n'est pas fournie (voir JwtUtil), pour éviter tout secret prévisible.
    secret: ${APP_JWT_SECRET:OI90JICKOIJIRSJIJSIJCSIJCRSJVJIVRIJVJSRJRIVJISVIJ}
    expiration: ${APP_JWT_EXPIRATION:86400000}

cors:
  # Origines autorisées (séparées par des virgules). Surcharger via CORS_ALLOWED_ORIGINS en prod.
  # Les motifs wildcard sont acceptés (ex: https://*.vercel.app pour les previews Vercel).
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

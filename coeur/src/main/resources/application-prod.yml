spring:
  datasource:
    # URL JDBC construite à partir des variables d'environnement du VPS / Docker Compose
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pharmacie_csu}?stringtype=unspecified
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

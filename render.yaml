# ──────────────────────────────────────────────────────────────────────────────
# Blueprint Render — backend Spring Boot (Docker) + base PostgreSQL gérée par Render.
#
# Ce fichier est à la RACINE du dépôt backend (à côté de pom.xml et Dockerfile).
#
# Déploiement « zéro config » :
#   1. git push de ce dépôt sur GitHub.
#   2. dashboard.render.com → New + → Blueprint → sélectionner ce dépôt.
#   3. Render CRÉE la base PostgreSQL puis le service web, et câble automatiquement
#      les variables DB_* depuis la base (rien à recopier).
#   4. Seule chose à saisir : CORS_ALLOWED_ORIGINS (URL du frontend).
#
# ⚠️  La base et le service sont dans la MÊME région (frankfurt) → l'hôte interne
#     est joignable et la connexion ne nécessite pas de SSL.
# ──────────────────────────────────────────────────────────────────────────────

databases:
  - name: pharmacie-csu-db
    databaseName: pharmacie_csu
    plan: free
    region: frankfurt

services:
  - type: web
    name: pharmacie-csu-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt          # ← identique à la région de la base ci-dessus
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ── Connexion PostgreSQL : injectée automatiquement depuis la base ci-dessus ──
      - key: DB_HOST
        fromDatabase:
          name: pharmacie-csu-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pharmacie-csu-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: pharmacie-csu-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: pharmacie-csu-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pharmacie-csu-db
          property: password

      # ── Sécurité ──
      - key: APP_JWT_SECRET
        generateValue: true    # généré une fois par Render, puis stable
      - key: APP_JWT_EXPIRATION
        value: "86400000"

      # ── CORS : URL du frontend déployé (ex : https://mon-app.vercel.app) ──
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ── JVM (instance free = 512 Mo) ──
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC"
        
      # ── Profil Spring Boot (Production) ──
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"

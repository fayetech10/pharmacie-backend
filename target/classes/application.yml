server:
  port: ${SERVER_PORT:8080}

spring:
  data:
    mongodb:
      # L'URI (avec identifiants) DOIT être fournie via la variable d'environnement
      # SPRING_DATA_MONGODB_URI en production. Le défaut ci-dessous ne sert qu'au
      # développement local et ne contient AUCUN identifiant.
      uri: ${SPRING_DATA_MONGODB_URI}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  application:
    name: pharmacie-csu

app:
  jwt:
    # OBLIGATOIRE : définir APP_JWT_SECRET (>= 32 caractères aléatoires).
    # Aucune valeur par défaut : le démarrage échoue volontairement si la variable
    # n'est pas fournie (voir JwtUtil), pour éviter tout secret prévisible.
    secret: ${APP_JWT_SECRET}
    expiration: ${APP_JWT_EXPIRATION}

cors:
  # Origines autorisées (séparées par des virgules). Surcharger via CORS_ALLOWED_ORIGINS en prod.
  # Les motifs wildcard sont acceptés (ex: https://*.vercel.app pour les previews Vercel).
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
